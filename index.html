html{scrollbar-gutter:stable}

/* Profile sections use different compositions, while retaining the Switch shell. */
.profile-section{margin-top:58px;scroll-margin-top:16px}
.profile-section .section-label{margin-top:0;padding-bottom:12px;border-bottom-color:#9a9ca2}

.profile-intro{grid-template-columns:150px minmax(0,1fr);gap:26px;padding:22px 26px;border-left:6px solid var(--cyan);margin-top:24px;background:linear-gradient(110deg,#fff 65%,#e5f7f8)}

.profile-history{border:0;background:transparent;position:relative;padding-left:19px}

const revealTargets=".section-label,.case-top,.case-step,.case-gallery figure,.case-nav,.portfolio-figure,.profile-panel,.profile-summary,.profile-history article,.profile-teaching,.profile-evidence,.profile-process article,.card,.shelf-item,.work-feature,.work-card";
function observeReveals(scope,detail){
  if(!revealObserver)return;
  const bottom=detail.getBoundingClientRect().bottom;
  $$(revealTargets,scope).forEach(element=>{
    if(element.getBoundingClientRect().top>=bottom-8)revealObserver.observe(element);
  });
}
function initializeScrollReveals(detail){
  revealObserver=null;
  if(mq.matches||!("IntersectionObserver" in window))return;
  revealObserver=new IntersectionObserver((entries,observer)=>{
    for(const {target,isIntersecting} of entries){
      if(!isIntersecting)continue;
      target.classList.add("scroll-revealed");
      observer.unobserve(target);
    }
  },{root:detail,rootMargin:"0px 0px -8px"});
  observeReveals(detail,detail);
}
function render(key,{record=true,scrollTop=0,section=null}={}){

  revealObserver=null;

  disposeFeaturedRotation?.();
  if(state==="home")lastFocus=document.activeElement;
  current=key;state="detail";homeHost.hidden=true;detailHost.hidden=false;
  const project=projects.find(p=>p.id===key);

  const result=project?.result ? '<p class="case-result">'+project.result+'</p>' : "";
  detailHost.innerHTML='<div class="shell detail-shell"><header class="detail-top">'+navigation+'<h1>'+c.title+'</h1><div class="status">'+c.charge+'% <span class="battery" aria-hidden="true"><i style="--charge:'+c.charge+'%"></i></span></div></header><div class="detail-grid">'+tocHTML(key)+'<article class="detail" tabindex="0" aria-labelledby="detail-heading"><div class="detail-content">'+(c.eyebrow?'<p class="eyebrow">'+c.eyebrow+'</p>':'')+'<h2 id="detail-heading" tabindex="-1">'+c.heading+'</h2>'+result+lead+c.body()+'</div></article></div><footer class="bar">'+navigation+'<div class="actions"><button data-sound aria-pressed="'+!muted+'">'+(muted?'효과음 꺼짐':'효과음 켜짐')+'</button><button data-action="leave">종료</button></div></footer></div>';
  initializeLibrary();
  initializeProjectTools();
  if(project)initializeCaseViewer(project);
  else if(key==="about")initializeCaseViewer(lectureGallery);
  watchActionBar(detailHost);
  animateBattery(detailHost,c.charge);
  window.scrollTo(0,0);
  const detail=$(".detail",detailHost);
  $("h2",detail).focus({preventScroll:true});
  initializeDetailOutline(detail,$(".toc",detailHost));
  initializeScrollReveals(detail);
  detail.scrollTop=scrollTop;
  if(section){
    const target=document.getElementById(section);
    if(target&&detail.contains(target)){
      detail.scrollTop+=target.getBoundingClientRect().top-detail.getBoundingClientRect().top-16;
      $("h3",target)?.focus({preventScroll:true});
      detail.dispatchEvent(new Event("scroll"));
    }
  }
  if(project)initializeCaseReel();
}

  {id:"srpg",image:"srpg",name:"SRPG 프로토타입 · AI 협업 개발 기록",category:"game",date:"2026.08",role:"개인 프로토타입 · 턴 규칙 기획 / AI 구현 검수",intro:"2D 유닛과 3D 맵을 결합한 SRPG 전투를 AI와 함께 만들며, 요청과 다르게 구현된 지점을 증상·원인·수정 기준으로 정리한 1주차 기록입니다.",
   imageCaption:"전투 단계에서만 나타나는 우측 명령 메뉴",focus:"턴 단계와 행동 자원의 정리",steps:[
     ["제작 방향 조정","처음에는 트라이앵글 스트래티지 같은 HD-2D 분위기를 목표로 했지만, 방향별 캐릭터 이미지와 정교한 배경·조명까지 맞추는 작업량이 컸습니다. 디지몬 서바이브처럼 2D 유닛과 3D 맵을 결합하는 방향으로 바꿨습니다."],
     ["타일과 맵 분리","‘타일맵’ 요청이 평평한 체스판으로, 이후에는 WASD 자유 이동으로 해석됐습니다. 유닛 선택 → 이동 가능 타일 표시 → 목적지 선택 순서로 다시 정의하고, 전투 타일을 3D 맵 위 반투명 오버레이로 분리해 맵을 바꿔도 이동·공격 규칙을 재사용하게 했습니다.","srpg-grid"],
     ["턴 단계와 행동력","‘추가 이동’이 반복 이동으로 해석돼 이동·이동·전투 순서가 가능해졌습니다. 턴을 최초 이동 → 전투 행동 → 후속 이동 → 종료로 나눴고, 이동과 공격이 같은 포인트를 써서 멀리 가면 공격하지 못하던 문제는 이동 포인트와 전투 행동 포인트를 분리해 해결했습니다.","srpg-menu"],
     ["범위 표시와 명령 메뉴","적의 이동 범위는 보라색, 이동 후 추가로 공격할 수 있는 범위는 빨간색으로 나눠 위험 지점을 읽게 했습니다. 이동 단계에서는 전투 메뉴를 숨기고, 공격이나 대기를 고르는 단계에서만 보이게 했습니다.","srpg-range"],
     ["점유와 사망 처리","여러 적이 같은 빈 타일을 목적지로 고르던 문제는 이동 목적지를 미리 예약하게 해 해결했습니다. 체력이 0이 된 유닛은 점유 타일 해제, 대상 목록과 턴 순서 제외, UI 정리를 먼저 한 뒤 제거하게 했습니다."],

  {id:"turtle",image:"turtle",name:"은둔형 외톨이를 위한 앱 ‘거북이를 날다’",category:"service",date:"2024",role:"인터뷰·리서치 / UX·UI",intro:"사회와의 연결이 어려운 사용자가 작은 일상 활동부터 시도하고, 기록과 커뮤니티·상담을 통해 다음 활동으로 이어가도록 설계한 앱 UX/UI 팀 프로젝트입니다.",

const rotationDelay=5000;
function slideRotation(advance){
  let timer=null;
  const stop=()=>clearInterval(timer);
  return {
    stop,
    restart(){
      stop();
      timer=setInterval(()=>{
        if(!document.hidden)advance();
      },rotationDelay);
    }
  };
}

function refreshLibrary(){
  const grid=$("#work-results",detailHost);if(!grid)return;
  const terms=portfolioState.query.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);
  const matches=projects.filter(p=>(portfolioState.category==="all"||p.category===portfolioState.category)&&terms.every(t=>[p.name,p.role,p.intro,categoryName(p.category),p.result,p.resultBadge].join(" ").toLocaleLowerCase().includes(t)));
  $("#work-count",detailHost).textContent=matches.length+"개 작업";
  for(const card of grid.children)revealObserver?.unobserve(card);
  grid.innerHTML=matches.length?matches.map(workCard).join(""):'<p class="archive-empty">조건에 맞는 작업이 없습니다. 검색어나 분야를 바꿔보세요.</p>';
  observeReveals(grid,$(".detail",detailHost));
  $$("[data-filter]",detailHost).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.filter===portfolioState.category)));
}
function initializeLibrary(){
  const query=$("#work-query",detailHost);if(!query)return;
  query.value=portfolioState.query;
  const featureButtons=$$("[data-feature]",detailHost);
  const featureCards=featureButtons.map(button=>$("#"+button.getAttribute("aria-controls"),detailHost));
  let featureIndex=0;
  function selectFeature(index){
    featureIndex=index;
    featureButtons.forEach((button,i)=>{
      button.setAttribute("aria-pressed",String(i===index));
      featureCards[i].hidden=i!==index;
    });
  }
  const featuredRotation=slideRotation(()=>{
    if(!featureCards[featureIndex].contains(document.activeElement)){
      selectFeature((featureIndex+1)%featureButtons.length);
    }
  });
  featuredRotation.restart();
  disposeFeaturedRotation=featuredRotation.stop;
  featureButtons.forEach((button,index)=>button.addEventListener("click",()=>{
    selectFeature(index);
    featuredRotation.restart();
  }));
  $("[data-library-jump]",detailHost).addEventListener("click",()=>{
    $(".work-archive h3",detailHost).scrollIntoView({behavior:mq.matches?"instant":"smooth",block:"start"});
    $(".work-archive h3",detailHost).focus({preventScroll:true});
  });
  query.addEventListener("input",()=>{portfolioState.query=query.value;refreshLibrary();});
  $$("[data-filter]",detailHost).forEach(b=>b.addEventListener("click",()=>{portfolioState.category=b.dataset.filter;tone("move");refreshLibrary();}));
  refreshLibrary();
}

function initializeProjectTools(){
  const tabs=$$("[data-tool]",detailHost);
  function selectTool(tab){
    tabs.forEach(button=>{
      const active=button===tab;
      button.setAttribute("aria-selected",String(active));
      button.tabIndex=active?0:-1;
      const panel=$("#"+button.getAttribute("aria-controls"),detailHost);
      panel.hidden=!active;
      const frame=$("iframe",panel);
      if(active&&frame&&!frame.hasAttribute("src"))frame.src=frame.dataset.src;
    });
  }
  tabs.forEach((tab,index)=>{
    tab.addEventListener("click",()=>selectTool(tab));
    tab.addEventListener("keydown",event=>{
      const next={ArrowRight:(index+1)%tabs.length,ArrowLeft:(index+tabs.length-1)%tabs.length,Home:0,End:tabs.length-1}[event.key];
      if(next===undefined)return;
      event.preventDefault();selectTool(tabs[next]);tabs[next].focus();
    });
  });
  if(tabs.length)selectTool(tabs[0]);
  $("[data-tool-jump]",detailHost)?.addEventListener("click",()=>{
    $(".project-tools h3",detailHost).scrollIntoView({behavior:mq.matches?"instant":"smooth",block:"start"});
    tabs[0].focus({preventScroll:true});
  });
}

let disposeCaseReel=null;
let youtubeAPI=null;
function loadYouTubeAPI(){
  if(window.YT?.Player)return Promise.resolve(window.YT);
  if(!youtubeAPI){
    youtubeAPI=new Promise((resolve,reject)=>{
      window.onYouTubeIframeAPIReady=()=>resolve(window.YT);
      const script=document.createElement("script");
      script.src="https://www.youtube.com/iframe_api";
      script.onerror=()=>{
        youtubeAPI=null;
        script.remove();
        reject(new Error("YouTube player API unavailable"));
      };
      document.head.append(script);
    });
  }
  return youtubeAPI;
}
function createReelPlayback(video,poster,status,onEnded){
  const slide=video.parentElement;
  let useYouTube=["http:","https:"].includes(location.protocol);
  let iframe=null,player=null,startTimer=null;

  function clearYouTube(){
    const oldFrame=iframe;
    const oldPlayer=player;
    iframe=player=null;
    clearTimeout(startTimer);
    oldPlayer?.destroy();
    oldFrame?.remove();
  }
  function playLocal(){
    if(!video.dataset.src){
      status.textContent="이 영상은 YouTube에서 제공됩니다. 재생이 어려우면 아래 ‘YouTube에서 열기’를 이용해 주세요.";
      poster.hidden=false;
      return;
    }
    if(!video.hasAttribute("src"))video.src=video.dataset.src;
    video.play().catch(()=>{
      if(!slide.hidden&&video.isConnected)poster.hidden=false;
    });
  }
  function play(){
    poster.hidden=true;
    if(!useYouTube){
      playLocal();
      return;
    }
    if(iframe)return;

    const url=new URL("https://www.youtube-nocookie.com/embed/"+slide.dataset.youtube);
    url.search=new URLSearchParams({
      enablejsapi:"1",origin:location.origin,playsinline:"1",rel:"0"
    });
    const frame=document.createElement("iframe");
    frame.title=video.getAttribute("aria-label");
    frame.allow="autoplay; encrypted-media; picture-in-picture; fullscreen";
    frame.allowFullscreen=true;
    frame.referrerPolicy="strict-origin-when-cross-origin";
    frame.src=url.href;
    iframe=frame;
    slide.append(frame);

    function fallBack(){
      if(iframe!==frame)return;
      clearYouTube();
      useYouTube=false;
      play();
    }
    startTimer=setTimeout(fallBack,12000);
    loadYouTubeAPI().then(YT=>{
      if(iframe!==frame)return;
      player=new YT.Player(frame,{
        events:{
          onReady({target}){
            if(iframe!==frame)return;
            target.mute();
            target.playVideo();
          },
          onStateChange({data}){
            if(iframe!==frame)return;
            if(data===YT.PlayerState.PLAYING){
              clearTimeout(startTimer);
              status.textContent="";
            }
            if(data===YT.PlayerState.ENDED)onEnded();
          },
          onAutoplayBlocked(){
            if(iframe!==frame)return;
            clearTimeout(startTimer);
            status.textContent="자동재생이 차단됐습니다. 영상의 ▶ 버튼을 눌러주세요.";
          },
          onError:fallBack
        }
      });
    }).catch(fallBack);
  }
  function stop(){
    clearYouTube();
    video.pause();
    video.currentTime=0;
    video.muted=true;
    poster.hidden=false;
  }
  video.addEventListener("playing",()=>{
    poster.hidden=true;
    status.textContent="";
  });
  video.addEventListener("ended",onEnded);
  video.addEventListener("error",()=>{
    status.textContent="영상 파일을 불러올 수 없습니다. HTML과 "+video.dataset.src+"를 같은 폴더에 두세요.";
  });
  return {play,stop};
}
function initializeCaseReel(){
  const reel=$(".case-reel",detailHost);
  if(!reel)return;
  const status=$(".reel-status",reel);
  const caption=$(".reel-caption",reel);
  const source=$(".reel-actions a",reel);
  const slides=$$(".reel-slide",reel);
  const thumbnails=$$(".reel-thumb",reel);
  const videoCards=$$("[data-reel-video]",detailHost);
  const zoomDialog=$(".photo-viewer",detailHost);
  const photos=slides.map((slide,i)=>slide.classList.contains("reel-video")?-1:i).filter(i=>i>=0);
  const playbacks=new Map();
  let index=0,disposed=false;
  const isVideo=i=>slides[i].classList.contains("reel-video");
  const rotation=slideRotation(()=>{
    if(!zoomDialog.open&&!slides[index].contains(document.activeElement)&&photos.length>1){
      select(photos[(photos.indexOf(index)+1)%photos.length],"right");
    }
  });
  function getPlayback(i){
    if(!playbacks.has(i)){
      const slide=slides[i],video=$("video",slide),poster=$(".reel-poster",slide);
      playbacks.set(i,createReelPlayback(video,poster,status,()=>{
        if(!disposed&&index===i)select(photos[0]??(i+1)%slides.length,"right",!photos.length);
      }));
    }
    return playbacks.get(i);
  }
  const autoplay=new IntersectionObserver(entries=>{
    for(const entry of entries){
      if(entry.intersectionRatio>.5&&entry.target===slides[index]&&isVideo(index)&&!disposed){
        autoplay.unobserve(entry.target);
        getPlayback(index).play();
      }
    }
  },{threshold:.55});
  function startVideo(){
    if(new URLSearchParams(location.search).get("play")!=="manual")autoplay.observe(slides[index]);
  }
  function select(next,direction=next<index?"left":"right",playImmediately=false){
    if(disposed)return;
    const target=(next+slides.length)%slides.length;
    if(target===index){
      if(isVideo(index)&&playImmediately){autoplay.unobserve(slides[index]);getPlayback(index).play();}
      else if(!isVideo(index)&&photos.length>1)rotation.restart();
      return;
    }
    autoplay.unobserve(slides[index]);
    if(isVideo(index))playbacks.get(index)?.stop();
    slides[index].hidden=true;
    thumbnails[index].setAttribute("aria-pressed","false");
    index=target;
    slides[index].dataset.enter=direction;
    slides[index].hidden=false;
    thumbnails[index].setAttribute("aria-pressed","true");
    videoCards.forEach(card=>card.setAttribute("aria-pressed",String(Number(card.dataset.reelVideo)===index)));
    const selected=thumbnails[index],videoSelected=isVideo(index);
    caption.textContent=videoSelected?$("video",slides[index]).getAttribute("aria-label"):selected.getAttribute("aria-label");
    const url=selected.dataset.source;
    source.hidden=!url;
    if(url){source.href=url;source.textContent=videoSelected?"YouTube에서 열기 ↗":"기사 원문 보기 ↗";}
    status.textContent="";
    if(videoSelected){
      rotation.stop();
      if(playImmediately)getPlayback(index).play();else startVideo();
    }else if(photos.length>1)rotation.restart();else rotation.stop();
  }
  slides.forEach((slide,i)=>{
    if(isVideo(i))$(".reel-poster",slide).addEventListener("click",()=>getPlayback(i).play());
  });
  if(isVideo(0))startVideo();else if(photos.length>1)rotation.restart();
  thumbnails.forEach((button,i)=>button.addEventListener("click",()=>select(i,undefined,true)));
  videoCards.forEach(button=>button.addEventListener("click",()=>{
    select(Number(button.dataset.reelVideo),undefined,true);
    reel.scrollIntoView({behavior:mq.matches?"instant":"smooth",block:"start"});
  }));
  $(".reel-prev",reel).addEventListener("click",()=>select(index-1,undefined,true));
  $(".reel-next",reel).addEventListener("click",()=>select(index+1,undefined,true));
  zoomDialog.addEventListener("close",()=>{
    if(!disposed&&!isVideo(index)&&photos.length>1)rotation.restart();
  });
  disposeCaseReel=()=>{
    disposed=true;
    rotation.stop();
    autoplay.disconnect();
    playbacks.forEach(playback=>playback.stop());
    disposeCaseReel=null;
  };
}

function initializeCaseViewer(project){
  const dialog=$(".photo-viewer",detailHost);
  if(!dialog)return;
  const stage=$(".photo-stage",dialog);
  const photo=$("img",stage);
  const photos=casePhotos(project);
  let index=0,opener=null,touchStart=null;
  function showPhoto(next){
    index=(next+photos.length)%photos.length;
    const [,caption,src]=photos[index];
    photo.alt=caption;
    photo.src=src;
    $(".photo-caption span",dialog).textContent=caption;
    $(".photo-count",dialog).textContent=(index+1)+" / "+photos.length;
  }
  $$("[data-photo]",detailHost).forEach(button=>button.addEventListener("click",()=>{
    opener=button;
    showPhoto(Number(button.dataset.photo));
    dialog.showModal();
  }));
  $(".photo-close",dialog).addEventListener("click",()=>dialog.close());
  $(".photo-prev",dialog).addEventListener("click",()=>showPhoto(index-1));
  $(".photo-next",dialog).addEventListener("click",()=>showPhoto(index+1));
  dialog.addEventListener("click",event=>{if(event.target===dialog)dialog.close();});
  dialog.addEventListener("close",()=>{
    touchStart=null;
    opener?.focus({preventScroll:true});
  });
  dialog.addEventListener("keydown",event=>{
    if(event.key==="Escape"){event.stopPropagation();return;}
    if(event.key!=="ArrowLeft"&&event.key!=="ArrowRight")return;
    event.preventDefault();
    showPhoto(index+(event.key==="ArrowLeft"?-1:1));
  });
  stage.addEventListener("pointerdown",event=>{
    if(event.target===photo&&event.pointerType==="touch"&&event.isPrimary)touchStart={x:event.clientX,y:event.clientY};
  });
  stage.addEventListener("pointerup",event=>{
    if(event.pointerType!=="touch"||!event.isPrimary||!touchStart)return;
    const dx=event.clientX-touchStart.x,dy=event.clientY-touchStart.y;
    touchStart=null;
    if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy))showPhoto(index+(dx<0?1:-1));
  });
  stage.addEventListener("pointercancel",()=>{touchStart=null;});
}

    '<section id="profile-recognition" class="profile-section" data-outline>'+sectionLabel("수상·평가 기록","RECOGNITION")+'<div class="content-grid">'+
      card("METEL · 팀 수상","2023년 제2회 동북권 메타버스 창작자 경진대회에서 3인 팀으로 청년 개발 부문 강원테크노파크원장상을 받았습니다.",ext(metelResultSource[0],"공식 보도자료"))+
      card("Tosian · 팀 1차 평가 통과","2024 메타버스 개발자 경진대회에서 ‘고양이 시야 연구소’ 팀으로 ㈜듀코젠 취업과제 1차 평가를 통과했습니다.",ext(tosianResultSource[0],"공식 평가 결과"))+'</div></section>'+
    '<section id="profile-focus" class="profile-section" data-outline>'+sectionLabel("지원 방향과 이어갈 작업","FOCUS")+'<div class="profile-focus-list"><article><span>UX 기획</span><h4>이해하고 선택하는 흐름</h4><p>플레이어의 목표와 제약을 파악하고, 필요한 정보와 조작 흐름을 기획하고 싶습니다. 서비스디자인의 사용자 관점과 라면축제의 현장 경험을 게임 UX에 연결하겠습니다.</p></article><article><span>시스템 기획</span><h4>선택을 뒷받침하는 규칙</h4><p>UX와 맞닿은 게임 규칙·장비·데이터를 함께 다루고 싶습니다. 로블록스 프로젝트의 무기·방어구 밸런스 기준과 익스트랙션의 데이터 편집기처럼, 의도와 수치를 문서와 도구로 구체화하는 작업을 이어갑니다.</p></article><article><span>콘텐츠 기획</span><h4>다시 경험하고 싶은 순간</h4><p>플레이어가 어떤 상황에서 흥미를 느끼고 다음 행동을 선택하는지 살피고 싶습니다. Stage D에서 시설 기록으로 단서와 서사를 함께 전한 경험과, 게임 플레이·영상 편집에서 쌓은 전달 흐름에 대한 관심을 넓혀가겠습니다.</p></article></div><div class="case-links">'+jump("play","게임 플레이 기록")+jump("fandom","서브컬처 관심사")+jump("contact","연락하기")+'</div></section>'+figure("about","기존 PR 문서 · 자기소개 보기")+photoViewerHTML("Blender 강의 자료");

  activities:{title:"PROJECTS",charge:67,heading:"작업 라이브러리",lead:"게임 기획, UX/UI, 서비스 디자인, VR과 영상 편집·도구 개선 작업을 한곳에서 살펴볼 수 있습니다.",eyebrow:"PORTFOLIO / PROJECTS",body:libraryHTML},

function back(){tone("back");const previous=navigationStack.pop();if(previous&&previous.key!=="home"){render(previous.key,{record:false,scrollTop:previous.scrollTop});return;}showHome(false);if(lastFocus?.isConnected)lastFocus.focus({preventScroll:true});else btns[selected].focus({preventScroll:true});}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.disabled)return;audioInit();if(b.hasAttribute("data-sound")){toggleSound();return;}const a=b.dataset.action;if(!a)return;if(a==="leave"){leave();return;}if(a==="home"){tone("back");showHome();return;}if(a==="back"){back();return;}if(a==="activate"){btns[selected].click();return;}if(content[a]){tone("open");render(a);}});
$("#start").addEventListener("click",()=>enter());$("#skip").addEventListener("click",()=>enter(true));
document.addEventListener("keydown",e=>{if(inMotion||e.altKey||e.ctrlKey||e.metaKey)return;if(e.key==="Escape"){e.preventDefault();if(state==="detail")back();else if(state==="home")leave();return;}if(state==="home"&&["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){e.preventDefault();const cols=matchMedia("(max-width:480px)").matches?2:matchMedia("(max-width:850px)").matches?3:5;const n=btns.filter(b=>!b.disabled).length;const delta={ArrowLeft:-1,ArrowRight:1,ArrowUp:-cols,ArrowDown:cols}[e.key];choose((selected+delta+n)%n);btns[selected].focus({preventScroll:true});}});
addEventListener("resize",()=>{if(state==="intro"&&!inMotion)drawIntro();});

}
